# Publish what is in this repository to GitHub Pages.
#
# There is no build step here on purpose: this repository holds the BUILT game
# and nothing else. The source, the content files and the history live in a
# private repository, and a playtest link is not a reason to open them.
#
# Runs on a push to main, and can be run by hand from the Actions tab.
name: Share build (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
